# Card spotting (binary: card vs background) on SoccerNet.
# Override any key from the CLI:  --set data.window=40 data.margin=12

paths:
  data_root: soccernet_data          # SoccerNet games (Labels-v2.json + {1,2}_224p.mkv)
  index: data/index.json             # built by src.index
  splits: data/splits.json           # built by src.index
  features: features                 # cached DINOv2 features
  runs: runs                         # training outputs

data:
  fps: 10                            # sampling rate for all clips/halves
  cache_len: 90                      # frames cached per training clip (9 s); windows are cropped from this
  window: 50                         # T = model input length in frames (5 s)
  margin: 15                         # card frame kept in [margin, T-1-margin] -> >=1.5 s context each side
  neg_exclusion_s: 60                # no negative centre within +-60 s of ANY card (visible or not shown)
  neg_pool: 15000                    # cached train negatives; resampled every epoch
  neg_mix: {random: 0.5, foul: 0.3, stoppage: 0.2}
  neg_per_pos: 4                     # train neg:pos ratio per epoch
  eval_neg_per_pos: 4                # neg:pos ratio for val/test clip-level metrics
  n_val_games: 20                    # sampled from official 'valid' split (held out)
  n_test_games: 20                   # sampled from official 'test' split (held out)
  seed: 0

targets:
  sigma: 10                          # Gaussian smoothing around card frame, in frames (1 s); zero beyond 3 sigma
  clip_weight: 0.5                   # loss = BCE(frame) + clip_weight * BCE(clip)

encoder:
  name: dinov2_vits14                # frozen, torch.hub facebookresearch/dinov2
  dim: 768                           # CLS(384) ++ mean patch token(384)
  batch_frames: 256
  num_workers: 4                     # PyAV decode workers
  chunk_frames: 300                  # decode chunk for full halves (30 s)

model:
  d_model: 256
  layers: 4
  heads: 4                           # head dim 64
  ffn: 1024
  dropout: 0.2
  attn_dropout: 0.1
  input_dropout: 0.1
  token_drop: 0.1                    # train-time: replace 10% of frame tokens with a learned mask token
  feat_noise: 0.05                   # train-time Gaussian noise after input projection + LayerNorm

train:
  batch_size: 128
  epochs: 40
  lr: 3.0e-4
  weight_decay: 0.05
  warmup: 0.05                       # fraction of total steps
  grad_clip: 1.0
  amp: true
  flip_p: 0.5                        # probability of using h-flipped features
  num_workers: 4
  patience: 10                       # early stop on select_metric; 0 disables
  select_metric: tight_mAP           # val metric used for best.pt

infer:
  stride: 10                         # sliding-window stride in frames (1 s)
  nms_window_s: 5                    # suppress +-2.5 s around each peak
  min_score: 0.01                    # keep peaks above this for mAP ranking
  batch_windows: 512

eval:
  tight_deltas: [1, 2, 3, 4, 5]                                  # SoccerNet tight a-mAP, match if |dt| <= delta/2
  loose_deltas: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60]  # SoccerNet loose a-mAP
  thresholds: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95]               # confidence grid
  grid_tolerances_s: [1, 2, 5]                                   # grid matching: |dt| <= tol seconds
  select_tolerance_s: 2                                          # threshold picked by best val F1 at this tolerance
